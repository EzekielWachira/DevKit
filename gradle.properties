# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# ---------------------------------------------------------------------------
# DevKit publishing
# ---------------------------------------------------------------------------
# The single source of truth for Maven coordinates and published versions.
# Deliberately here rather than in gradle/libs.versions.toml: the version
# catalog manages the dependencies DevKit *builds against*, which is a
# different lifecycle from the versions DevKit *publishes under*. Conflating
# the two makes it impossible to bump a build dependency without appearing to
# release something.

devkit.group=io.github.ezekielwachira.devkit

# Individual kit versions. These move independently — a NetKit release does
# not oblige FillKit to move, and vice versa. Every kit starts its published
# line at 0.1.0: the pre-release milestone numbers used during development
# (FillKit 0.4, NetKit 0.3) were never published, so the public version line
# starts fresh rather than inheriting numbers no consumer ever saw.
devkit.version.core=0.1.0
devkit.version.fillkit=0.1.0
devkit.version.netkit=0.1.0

# The ecosystem version, shared by devkit, devkit-debug and devkit-bom. It
# names a *tested compatible set* of the kit versions above rather than the
# maturity of any one kit, and moves when that set changes.
devkit.version.ecosystem=0.1.0

# POM metadata shared by every publication.
devkit.pom.url=https://github.com/EzekielWachira/DevKit
devkit.pom.scm.connection=scm:git:git://github.com/EzekielWachira/DevKit.git
devkit.pom.scm.developerConnection=scm:git:ssh://git@github.com/EzekielWachira/DevKit.git
devkit.pom.developer.id=EzekielWachira
devkit.pom.developer.name=Ezekiel Wachira
devkit.pom.developer.url=https://github.com/EzekielWachira

# Must match LICENSE.md at the repository root. The name and URL are the values
# Maven Central expects for Apache-2.0; `repo` states that the artifact may be
# redistributed from a repository.
devkit.pom.license.name=The Apache License, Version 2.0
devkit.pom.license.url=https://www.apache.org/licenses/LICENSE-2.0.txt
devkit.pom.license.distribution=repo
