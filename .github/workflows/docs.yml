name: Docs

# The site is generated from the repository's own READMEs, so it is rebuilt
# whenever those change — and on pull requests, where it only *builds*, so a
# broken cross-reference is caught before it is merged rather than after it is
# published.
on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'mkdocs.yml'
      - 'docs-src/**'
      # The pictures and clips are part of the site, so changing one has to
      # rebuild it. Leaving this out meant a commit that replaced every
      # recording deployed nothing at all, silently: no workflow ran, so there
      # was not even a skipped job to notice.
      - 'docs-assets/**'
      - 'docs-requirements.txt'
      - 'scripts/build_docs.py'
      - 'scripts/check_docs_links.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'mkdocs.yml'
      - 'docs-src/**'
      # The pictures and clips are part of the site, so changing one has to
      # rebuild it. Leaving this out meant a commit that replaced every
      # recording deployed nothing at all, silently: no workflow ran, so there
      # was not even a skipped job to notice.
      - 'docs-assets/**'
      - 'docs-requirements.txt'
      - 'scripts/build_docs.py'
      - 'scripts/check_docs_links.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one half-done: Pages serves
# whatever the last completed deployment left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: Install
        run: pip install -r docs-requirements.txt

      # Assembles `site-src/` from the READMEs. Fails if any `#anchor` in them
      # points at a heading that does not exist.
      - name: Generate pages
        run: python3 scripts/build_docs.py

      # `--strict` fails on a link to a page that does not exist.
      - name: Build site
        run: mkdocs build --strict
        env:
          DISABLE_MKDOCS_2_WARNING: 'true'

      # And this fails on a link to a page that *does* exist, at an anchor that
      # does not — which the strict build does not check, and which is the
      # failure mode that splitting one README into ninety pages actually has.
      - name: Check links and anchors
        run: python3 scripts/check_docs_links.py

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy
    # Pull requests build but do not publish. A fork's PR must never be able to
    # replace what is served at the project's own URL.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
