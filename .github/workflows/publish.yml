name: Publish

# Never on a branch push. Publishing to Maven Central is irreversible — a
# version, once released, cannot be replaced — so it takes a deliberate act:
# either a published GitHub Release, or a manual dispatch naming what to ship.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      module:
        description: >-
          Space-separated Gradle paths to publish, or "all". Publishing some
          modules without the others is the normal case after the first
          release: kit versions are independent, a NetKit release should not
          oblige FillKit to move, and Maven Central rejects a version that is
          already there — so "all" only works while nothing has shipped.
          A set is published as ONE deployment, so the artifacts validate and
          release together. Valid paths: :core :chartkit :fillkit:api
          :fillkit:engine :fillkit:debug :fillkit:testing :netkit :devkit
          :devkit-debug :devkit-bom
        required: true
        default: ':chartkit :devkit :devkit-debug :devkit-bom'
        type: string
      dryRun:
        description: Publish to Maven Local only, without releasing
        required: false
        default: false
        type: boolean

# One publish at a time. Two concurrent runs could stage the same version twice.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build

      # The check that matters before a release: resolve and compile the
      # artifacts from a consumer that knows them only by Maven coordinates.
      # A project dependency inside the main build would prove none of it.
      - name: Verify publication
        run: ./scripts/verify-publication.sh

      # Configure the *real* publish task without running it.
      #
      # `verify-publication.sh` publishes to Maven Local, which touches neither
      # the publishing plugin's build service nor the remote repository spec —
      # so it cannot see the two things that have actually broken a release:
      # a build service Gradle 9 refuses to inject, and a repository spec the
      # configuration cache cannot serialise. Both surface here, in seconds,
      # for free. A release has been lost to each of them.
      #
      # Dummy credentials because the task graph must be built to be checked,
      # and the plugin wants credentials to configure the repository. They are
      # never used: `--dry-run` executes nothing.
      - name: Dry-run the publish task graph
        run: ./gradlew publishToMavenCentral --dry-run --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: dry-run
          ORG_GRADLE_PROJECT_mavenCentralPassword: dry-run

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    # A dry run stops after `verify`, which has already published to Maven Local
    # and resolved from it.
    if: ${{ github.event_name == 'release' || inputs.dryRun == false }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Publish to Maven Central
        # A release publishes everything; a dispatch publishes what it named.
        #
        # Run from the root, `all` bundles every module into a *single* Portal
        # deployment, which is what makes the artifacts validate and release
        # together rather than as several deployments that can each fail
        # separately. A named set gets the same treatment — one Gradle
        # invocation, one deployment.
        #
        # `all` is only correct while nothing has shipped. Central refuses a
        # version that already exists, so once a kit is out, a release event
        # firing `all` will be rejected as a whole. Incremental releases go
        # through a dispatch naming the modules whose versions actually moved.
        #
        # Secrets reach Gradle through the environment and are never echoed —
        # note there is no `env:` dump and no `--info`, both of which would put
        # credentials in a public log.
        run: |
          # `--no-configuration-cache` is required, not defensive. Publishing a
          # release to Central cannot be config-cached yet — the repository spec
          # is not serialisable, pending https://github.com/gradle/gradle/issues/22779
          # — and the failure is a serialisation error at the end of the task
          # graph rather than anything resembling a publishing problem. Every
          # other job keeps the cache; only this task opts out.
          MODULE="${{ github.event_name == 'release' && 'all' || inputs.module }}"
          if [ "$MODULE" = "all" ]; then
            ./gradlew publishToMavenCentral --no-configuration-cache
          else
            # One Gradle invocation for the whole set, so several artifacts
            # that move together — a kit plus the umbrella and BOM that now
            # name it — land as a single Portal deployment. Publishing them one
            # dispatch at a time would make each one able to fail on its own,
            # leaving the umbrella referring to a version that never shipped.
            TASKS=""
            for m in $MODULE; do
              case "$m" in
                :*) TASKS="$TASKS ${m}:publishToMavenCentral" ;;
                *)  echo "::error::Not a Gradle path: '$m' (expected a leading colon)"; exit 1 ;;
              esac
            done
            # shellcheck disable=SC2086
            ./gradlew $TASKS --no-configuration-cache
          fi
        # `ORG_GRADLE_PROJECT_*` is not decoration: Gradle turns a variable with
        # that prefix into the Gradle property of the same name, which is how
        # the publishing plugin expects to be given credentials. The GitHub
        # secret names are unchanged.
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Where it went
        run: |
          echo "Uploaded as a Central Portal deployment, held for review."
          echo "Release it at https://central.sonatype.com/publishing/deployments"
